<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="64" height="64" role="img" aria-label="MoonBite">
  <defs>
    <linearGradient id="moonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e90ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#ffaa44;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.3" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Main moon/planet circle -->
  <circle cx="64" cy="64" r="52" fill="url(#moonGradient)" filter="url(#glow)"/>
  <!-- Craters -->
  <circle cx="40" cy="45" r="5" fill="#0a4080" opacity="0.6"/>
  <circle cx="75" cy="55" r="3.5" fill="#0a4080" opacity="0.5"/>
  <circle cx="50" cy="80" r="4" fill="#0a4080" opacity="0.5"/>
  <circle cx="85" cy="75" r="2.5" fill="#0a4080" opacity="0.4"/>
  <circle cx="60" cy="35" r="2" fill="#0a4080" opacity="0.4"/>
  <!-- Fire/explosion effects on right side -->
  <ellipse cx="100" cy="50" rx="18" ry="22" fill="#ff8844" opacity="0.8"/>
  <ellipse cx="105" cy="55" rx="15" ry="18" fill="#ffaa44" opacity="0.7"/>
  <ellipse cx="110" cy="45" rx="12" ry="16" fill="#ffcc66" opacity="0.6"/>
  <!-- Floating sparks -->
  <circle cx="125" cy="35" r="2.5" fill="#ffdd88" opacity="0.9"/>
  <circle cx="135" cy="45" r="2" fill="#ffdd88" opacity="0.8"/>
  <circle cx="128" cy="62" r="1.8" fill="#ffdd88" opacity="0.7"/>
  <circle cx="140" cy="55" r="1.5" fill="#ffdd88" opacity="0.6"/>
  <!-- Ring/orbit effect -->
  <path d="M 40 65 Q 64 90, 88 65 Q 64 100, 40 65" fill="none" stroke="#ff9944" stroke-width="1.5" opacity="0.4"/>
  <!-- Glow aura -->
  <circle cx="64" cy="64" r="55" fill="none" stroke="url(#glowGradient)" stroke-width="2" opacity="0.3"/>
</svg>
