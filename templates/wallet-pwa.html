<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0a0e27">
    <meta name="description" content="MoonBite Wallet - Premium, billion-dollar cryptocurrency wallet">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MoonBite">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%230a0e27' width='180' height='180'/><circle cx='90' cy='90' r='70' fill='%2300d4ff' opacity='0.1'/><text x='50%' y='50%' font-size='80' fill='%2300d4ff' text-anchor='middle' dominant-baseline='central' font-weight='bold'>🌙</text></svg>">
    <link rel="manifest" href="/wallet-manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2300d4ff' opacity='0.15'/><text x='50%' y='50%' font-size='50' fill='%2300d4ff' text-anchor='middle' dominant-baseline='central'>🌙</text></svg>">
    <title>MoonBite - Premium Wallet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            overflow: hidden;
        }

        :root {
            --primary: #00d4ff;
            --primary-light: #33e5ff;
            --primary-dark: #0099cc;
            --accent: #ff006e;
            --success: #00ff88;
            --warning: #ffb700;
            --danger: #ff3333;
            --bg-dark: #0a0e27;
            --bg-darker: #050709;
            --bg-card: #141829;
            --bg-card-light: #1f2438;
            --border: #2a3050;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-tertiary: #707080;
            --glass-blur: 20px;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 212, 255, 0.08);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.4);
        }

        body {
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
        }

        .wallet-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 428px;
            height: 100vh;
            max-height: 100vh;
            margin: 0 auto;
            background: var(--bg-dark);
            overflow: hidden;
            position: relative;
        }

        /* Background effects */
        .wallet-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.05) 0%, transparent 70%);
            pointer-events: none;
            animation: drift 20s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        /* === HEADER / STATUS BAR === */
        .wallet-header {
            padding: max(12px, env(safe-area-inset-top)) 16px 12px;
            background: rgba(14, 18, 39, 0.8);
            backdrop-filter: blur(var(--glass-blur));
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-badge {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            color: var(--success);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        /* === MAIN CONTENT === */
        .wallet-main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            position: relative;
            z-index: 1;
        }

        .wallet-main::-webkit-scrollbar {
            width: 4px;
        }

        .wallet-main::-webkit-scrollbar-track {
            background: transparent;
        }

        .wallet-main::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 2px;
        }

        /* === BALANCE CARD === */
        .balance-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(255, 0, 110, 0.05) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 24px;
            backdrop-filter: blur(var(--glass-blur));
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .balance-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .balance-value {
            font-size: 40px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 4px;
            letter-spacing: -1px;
        }

        .balance-currency {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 400;
            display: inline-block;
            margin-left: 8px;
        }

        .balance-subtext {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 12px;
        }

        .balance-change {
            display: inline-block;
            color: var(--success);
            margin-left: 4px;
        }

        /* === QUICK ACTIONS === */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 12px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px;
        }

        /* === CHART SECTION === */
        .chart-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .time-filters {
            display: flex;
            gap: 8px;
        }

        .time-filter {
            padding: 4px 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .time-filter.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--bg-dark);
        }

        .chart-placeholder {
            width: 100%;
            height: 180px;
            background: linear-gradient(to top, rgba(0, 212, 255, 0.05), transparent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            font-size: 12px;
            position: relative;
        }

        .chart-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to top, rgba(0, 212, 255, 0.2), transparent);
            border-radius: 8px;
            border-top: 2px solid var(--primary);
        }

        /* === TRANSACTION LIST === */
        .transactions-section {
            margin-bottom: 24px;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .transaction-item:hover {
            background: var(--bg-card-light);
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .tx-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .tx-icon.send {
            background: rgba(255, 0, 110, 0.1);
        }

        .tx-icon.receive {
            background: rgba(0, 255, 136, 0.1);
        }

        .tx-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tx-type {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .tx-time {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .tx-amount {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .tx-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .tx-value.send {
            color: var(--accent);
        }

        .tx-value.receive {
            color: var(--success);
        }

        .tx-status {
            font-size: 10px;
            color: var(--text-tertiary);
        }

        /* === BOTTOM NAVIGATION === */
        .wallet-nav {
            padding: 12px 16px max(12px, env(safe-area-inset-bottom));
            background: rgba(14, 18, 39, 0.8);
            backdrop-filter: blur(var(--glass-blur));
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 20px;
        }

        /* === MODAL / DIALOG === */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
            align-items: flex-end;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            width: 100%;
            max-width: 428px;
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            padding: 24px 16px max(24px, env(safe-area-inset-bottom));
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
        }

        /* === FORM ELEMENTS === */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 14px 12px;
            background: var(--bg-darker);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-card);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
        }

        /* === BUTTONS === */
        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: var(--bg-dark);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        /* === RESPONSIVE === */
        @media (max-height: 600px) {
            .balance-value {
                font-size: 32px;
            }
            .wallet-main {
                padding: 12px;
            }
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: loading 1.4s infinite;
        }

        @keyframes loading {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="wallet-container">
        <!-- HEADER -->
        <header class="wallet-header">
            <div class="header-left">
                <div class="logo-badge">🌙</div>
                <div>
                    <div class="header-title">MoonBite</div>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>Synced</span>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" title="Settings">⚙️</button>
                <button class="icon-btn" title="Menu">⋮</button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="wallet-main">
            <!-- Balance Card -->
            <div class="balance-card">
                <div class="balance-label">Total Balance</div>
                <div>
                    <span class="balance-value">0.00</span>
                    <span class="balance-currency">MBITE</span>
                </div>
                <div class="balance-subtext">
                    ≈ $0.00 USD
                    <span class="balance-change">↑ +2.5%</span>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <button class="action-btn">
                    <div class="action-icon">📤</div>
                    <span>Send</span>
                </button>
                <button class="action-btn">
                    <div class="action-icon">📥</div>
                    <span>Receive</span>
                </button>
                <button class="action-btn">
                    <div class="action-icon">⚡</div>
                    <span>Mine</span>
                </button>
            </div>

            <!-- Chart Section -->
            <div class="chart-section">
                <div class="section-header">
                    <div class="section-title">24h Performance</div>
                    <div class="time-filters">
                        <button class="time-filter active">1D</button>
                        <button class="time-filter">1W</button>
                        <button class="time-filter">1M</button>
                    </div>
                </div>
                <div class="chart-placeholder">
                    <div class="chart-line"></div>
                    <span>Loading chart...</span>
                </div>
            </div>

            <!-- Recent Transactions -->
            <div class="transactions-section">
                <div class="section-header" style="margin-bottom: 12px;">
                    <div class="section-title">Recent Activity</div>
                    <button style="background: none; border: none; color: var(--primary); cursor: pointer; font-size: 12px; font-weight: 500;">View All</button>
                </div>

                <!-- Send Transaction -->
                <div class="transaction-item">
                    <div class="tx-icon send">📤</div>
                    <div class="tx-info">
                        <div class="tx-type">Sent to Wallet</div>
                        <div class="tx-time">Today at 2:45 PM</div>
                    </div>
                    <div class="tx-amount">
                        <div class="tx-value send">-0.50 MBITE</div>
                        <div class="tx-status">Confirmed</div>
                    </div>
                </div>

                <!-- Receive Transaction -->
                <div class="transaction-item">
                    <div class="tx-icon receive">📥</div>
                    <div class="tx-info">
                        <div class="tx-type">Received from Mining</div>
                        <div class="tx-time">Yesterday at 11:20 AM</div>
                    </div>
                    <div class="tx-amount">
                        <div class="tx-value receive">+1.25 MBITE</div>
                        <div class="tx-status">Confirmed</div>
                    </div>
                </div>

                <!-- Pending Transaction -->
                <div class="transaction-item">
                    <div class="tx-icon send">📤</div>
                    <div class="tx-info">
                        <div class="tx-type">Pending Withdrawal</div>
                        <div class="tx-time">2 hours ago</div>
                    </div>
                    <div class="tx-amount">
                        <div class="tx-value send">-2.00 MBITE</div>
                        <div class="tx-status"><span class="loading"></span> Processing</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav class="wallet-nav">
            <button class="nav-item active">
                <div class="nav-icon">💰</div>
                <span>Wallet</span>
            </button>
            <button class="nav-item">
                <div class="nav-icon">📊</div>
                <span>Analytics</span>
            </button>
            <button class="nav-item">
                <div class="nav-icon">⛏️</div>
                <span>Mining</span>
            </button>
            <button class="nav-item">
                <div class="nav-icon">👤</div>
                <span>Profile</span>
            </button>
        </nav>
    </div>

    <script>
        // Premium interactions
        document.querySelectorAll('.action-btn, .nav-item, .transaction-item').forEach(el => {
            el.addEventListener('click', function() {
                // Visual feedback
                this.style.opacity = '0.7';
                setTimeout(() => this.style.opacity = '1', 150);
            });
        });

        // Time filter toggle
        document.querySelectorAll('.time-filter').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.time-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Smooth animations on load
        setTimeout(() => {
            document.querySelectorAll('.transaction-item').forEach((item, i) => {
                item.style.opacity = '0';
                item.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    item.style.transition = 'all 0.4s ease';
                    item.style.opacity = '1';
                    item.style.transform = 'translateY(0)';
                }, i * 100);
            });
        }, 300);

        console.log('🌙 MoonBite Premium Wallet loaded - Synced and ready');
    </script>
</body>
</html>
