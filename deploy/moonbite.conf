# MoonBite seed-node configuration  ->  /etc/moonbite/moonbite.conf
# A "seed node" is a permanently-online full node that new nodes connect to
# in order to discover the rest of the network. Run 2-5 of these on separate VPS
# hosts and hard-code their IPs into chainparams.cpp (vSeeds / vFixedSeeds) or a
# DNS seeder before public launch.

# --- Identity / behaviour ---
server=1
daemon=1
listen=1
txindex=1                 # required if this node also backs the block explorer
# UTXO cache (MB). 128 is safe on a 512MB VPS alongside the ~256MB RandomX
# PoW-validation cache + node baseline (add swap on tiny hosts). Raise on
# bigger VPS for faster sync/validation.
dbcache=128

# --- P2P: accept inbound connections from the whole internet ---
port=9444
bind=0.0.0.0
maxconnections=125
# discover=1 lets the node advertise its own public address to peers.
discover=1
# listenonion=0            # set 1 + torcontrol if running behind Tor

# --- Peer to the live MoonBite network ---
# The canonical seed set lives in deploy/seeds.txt. setup-node.sh reads that
# file and regenerates these addnode= lines, so keep seeds.txt authoritative
# and add permanent VPS seeds there (one host:port per line).
# Live bootstrap seed (Railway TCP proxy -> internal :9444). NOTE: this is a
# non-standard, rotating public port; update it if Railway reassigns the proxy.
addnode=hayabusa.proxy.rlwy.net:14389
# addnode=SEED_B_PUBLIC_IP:9444
# addnode=SEED_C_PUBLIC_IP:9444

# --- RPC: KEEP PRIVATE. Only localhost + the explorer host. ---
rpcport=9445
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
# Generate a strong credential pair, do NOT reuse this example:
rpcuser=CHANGE_ME_user
rpcpassword=CHANGE_ME_LONG_RANDOM_64_CHARS
# Better: use rpcauth= (hashed) instead of a plaintext password. Generate with
# the share/rpcauth/rpcauth.py helper from the source tree.

# --- Logging ---
# debug=net               # uncomment to debug peer connectivity
shrinkdebugfile=1
